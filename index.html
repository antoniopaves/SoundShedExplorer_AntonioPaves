<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SoundShed Explorer</title>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg border-bottom">
            <div class="container">

                <a class="navbar-brand" href="#">
                    SOUNDSHED EXPLORER
                </a>

                <button 
                    class="navbar-toggler" 
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Inicio</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Presets</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Contacto</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>


    <main>
        <section class="container text-center py-4">

            <h1>
                Guía visual de presets y cadenas
                <br>
                para guitarra digital
            </h1>

            <a href="#" class="btn btn-outline-dark mt-3">
                Ver Catálogo
            </a>

        </section>

        <section class="container border-top border-bottom py-3">

            <div class="row g-4">

                <div class="col-12 col-md-4">

                    <article class="card h-100">

                        <div class="card-body text-center">

                            <h2 class="h5">
                                SHOEGAZE FUZZ
                            </h2>

                            <div class="d-flex flex-column gap-2 align-items-center my-3">

                                <span class="badge text-bg-light border">
                                    OVERDRIVE
                                </span>

                                <span class="badge text-bg-light border">
                                    FUZZ → DELAY
                                </span>

                            </div>

                            <a href="#" class="btn btn-outline-dark">
                                Ver Detalle
                            </a>

                        </div>

                    </article>

                </div>


                <div class="col-12 col-md-4">

                    <article class="card h-100">

                        <div class="card-body text-center">

                            <h2 class="h5">
                                J-ROCK CRUNCH
                            </h2>

                            <div class="d-flex flex-column gap-2 align-items-center my-3">

                                <span class="badge text-bg-light border">
                                    COMPRESSOR
                                </span>

                                <span class="badge text-bg-light border">
                                    AMP → CAB
                                </span>

                            </div>

                            <a href="#" class="btn btn-outline-dark">
                                Ver Detalle
                            </a>

                        </div>

                    </article>

                </div>


                <div class="col-12 col-md-4">

                    <article class="card h-100">

                        <div class="card-body text-center">

                            <h2 class="h5">
                                CLEAN AMBIENT
                            </h2>

                            <div class="d-flex flex-column gap-2 align-items-center my-3">

                                <span class="badge text-bg-light border">
                                    CHORUS
                                </span>

                                <span class="badge text-bg-light border">
                                    DELAY
                                </span>

                            </div>

                            <a href="#" class="btn btn-outline-dark">
                                Ver Detalle
                            </a>

                        </div>

                    </article>

                </div>

            </div>

        </section>

    </main>

    <footer class="border-top text-center py-3">

        <div class="container">
            <strong>Footer</strong>
        </div>

    </footer>

    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
